spring.application.name=retail-backend
server.port=8080

# Local credentials live in the ignored backend/.env file.
spring.config.import=optional:file:./.env[.properties]

logging.level.com.retail=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n

spring.datasource.url=${DB_URL:jdbc:postgresql://db.kppgqkwoqeavbdxmjqoj.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.flyway.enabled=true

# Configure JWT_SECRET through the environment or local .env file.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# Google OAuth Web Client ID. Google ID tokens are verified server-side.
app.google.client-id=${GOOGLE_CLIENT_ID:357151934389-8jhc1neuf7ug3rct0bk3c906395r2kco.apps.googleusercontent.com}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://retail-app-fe.bhargavvishwa2002.workers.dev,http://localhost:5174}

# Internal AI integration. Configure the same shared secret in the AI Processor.
app.service-auth.shared-secret=${AI_PROCESSOR_SHARED_SECRET:<same-long-secret>}
app.service-auth.max-clock-skew-seconds=${AI_PROCESSOR_MAX_CLOCK_SKEW_SECONDS:60}
app.ai.processor-url=${AI_PROCESSOR_URL:http://localhost:8090}
# Set a private random base64 key in deployment; the local fallback is not for shared environments.
app.ai.actor-token-secret=${AI_ACTOR_TOKEN_SECRET:${app.jwt.secret}}

# Optional, explicitly configured first-run owner. Leave unset after the first owner exists.
app.bootstrap-owner.name=${BOOTSTRAP_OWNER_NAME:Owner}
app.bootstrap-owner.email=${BOOTSTRAP_OWNER_EMAIL:bhargavvishwa2002@gmail.com}
