spring.application.name=retail-backend
server.port=8080

logging.level.com.retail=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n

spring.datasource.url=${DB_URL:jdbc:postgresql://db.kppgqkwoqeavbdxmjqoj.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.flyway.enabled=true

# Local-development fallback only. Always set JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:cmV0YWlsLWRldi1vbmx5LWp3dC1rZXktcGxlYXNlLWNoYW5nZS0zMg==}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# Internal AI integration. Configure the same shared secret in the AI Processor.
app.service-auth.shared-secret=${AI_PROCESSOR_SHARED_SECRET:<same-long-secret>}
app.service-auth.max-clock-skew-seconds=${AI_PROCESSOR_MAX_CLOCK_SKEW_SECONDS:60}
app.ai.processor-url=${AI_PROCESSOR_URL:http://localhost:8090}
# Set a private random base64 key in deployment; the local fallback is not for shared environments.
app.ai.actor-token-secret=${AI_ACTOR_TOKEN_SECRET:${JWT_SECRET:cmV0YWlsLWRldi1vbmx5LWp3dC1rZXktcGxlYXNlLWNoYW5nZS0zMg==}}

# Optional first-run owner account. Set both email and password to seed an owner.
app.bootstrap-owner.name=${BOOTSTRAP_OWNER_NAME:Owner}
app.bootstrap-owner.email=${BOOTSTRAP_OWNER_EMAIL:s@gmail.com}
app.bootstrap-owner.password=${BOOTSTRAP_OWNER_PASSWORD:123456789}
